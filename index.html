<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlantic Tours Assistant</title>
<meta name="description" content="Ask about tours along Ireland's Wild Atlantic Way. Answers come live from the Atlantic Tours Google Sheet.">
<meta name="theme-color" content="#f7f8fa">
<meta property="og:type" content="website">
<meta property="og:title" content="Atlantic Tours Assistant">
<meta property="og:description" content="A chatbot with live access to the Atlantic Tours Google Sheet: prices, availability and offers along Ireland's west coast.">
<meta property="og:image" content="https://victordelrosal.com/atlantic-tours02/og.png">
<meta property="og:url" content="https://victordelrosal.com/atlantic-tours02/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Atlantic Tours Assistant">
<meta name="twitter:description" content="A chatbot with live access to the Atlantic Tours Google Sheet.">
<meta name="twitter:image" content="https://victordelrosal.com/atlantic-tours02/og.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --ink:#0f1b2d; --muted:#6b7686; --line:#e6e9ef;
  --navy:#0f2a4a; --sea:#2f6f9f; --gold:#c9a24a; --user:#0f2a4a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:rgba(247,248,250,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand img{width:28px;height:28px;border-radius:8px}
.live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.15)}
.dot.err{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.15)}
.new{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;
  padding:7px 12px;border-radius:999px;cursor:pointer;margin-left:12px}
.new:hover{border-color:#cfd5de}
.right{display:flex;align-items:center}

/* conversation */
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:720px;margin:0 auto;padding:8px 20px 24px}

.hello{padding:12vh 0 0;text-align:center;animation:rise .5s ease both}
.hello img{width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(15,42,74,.18)}
.hello h1{font-size:clamp(26px,4.5vw,34px);letter-spacing:-.02em;margin:20px 0 8px;font-weight:700}
.hello h1 span{background:linear-gradient(90deg,var(--sea),var(--navy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--muted);margin:0 auto;max-width:440px;line-height:1.55}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:32px 0 0;text-align:left}
@media (max-width:560px){.cards{grid-template-columns:1fr;margin-top:24px}.hello{padding-top:5vh}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
  font:inherit;text-align:left;color:var(--ink);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:#cfd5de;transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,27,45,.06)}
.card b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.card small{color:var(--muted);font-size:13px}

.row{display:flex;gap:12px;margin:22px 0;animation:rise .25s ease both}
.row.me{justify-content:flex-end}
.av{flex:0 0 30px;height:30px;border-radius:9px;overflow:hidden;margin-top:2px}
.av img{width:100%;height:100%}
.bubble{line-height:1.6;font-size:15.5px;word-wrap:break-word;min-width:0}
.me .bubble{background:var(--user);color:#fff;padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:80%;white-space:pre-wrap}
.bot .bubble{padding-top:4px;flex:1}
.bot .bubble p{margin:0 0 10px} .bot .bubble p:last-child{margin:0}
.bot .bubble ul{margin:6px 0 10px;padding-left:20px} .bot .bubble li{margin:3px 0}
.dots{display:inline-flex;gap:5px;padding:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#aab3c0;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* composer */
.dock{padding:10px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
form{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:26px;padding:8px 8px 8px 20px;box-shadow:0 8px 30px rgba(15,27,45,.08);transition:border-color .15s,box-shadow .15s}
form:focus-within{border-color:#c3ccd8;box-shadow:0 8px 30px rgba(15,27,45,.12)}
textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:15.5px;line-height:1.5;padding:8px 0;max-height:160px;background:transparent;color:var(--ink)}
.send{flex:0 0 38px;height:38px;border-radius:50%;border:0;background:var(--navy);color:#fff;cursor:pointer;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.send:hover{transform:scale(1.05)}
.send:disabled{opacity:.25;cursor:default;transform:none}
.fine{text-align:center;color:var(--muted);font-size:11.5px;margin:10px 0 0}
.fine a{color:inherit}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="">Atlantic Tours</div>
  <div class="right">
    <div class="live" title="Answers are read from the Google Sheet each time you ask"><span class="dot" id="dot"></span><span id="status">Connecting...</span></div>
    <button class="new" id="reset" hidden>New chat</button>
  </div>
</header>

<div class="scroll" id="scroll">
  <div class="col" id="col">
    <section class="hello" id="hello">
      <img src="icon.svg" alt="">
      <h1>Where on the <span>Wild Atlantic Way?</span></h1>
      <p>Ask about any tour in Clare, Galway or Mayo: prices, places left this week and special offers, straight from our live schedule.</p>
      <div class="cards">
        <button class="card" data-q="Which kayak trips have places this week?"><b>Kayak trips</b><small>Which have places this week?</small></button>
        <button class="card" data-q="What family-friendly tours are under €50?"><b>Family days out</b><small>Tours under €50</small></button>
        <button class="card" data-q="What special offers are on right now?"><b>Special offers</b><small>What deals are on?</small></button>
        <button class="card" data-q="What's the best food tour in Galway?"><b>Food tours</b><small>Best one in Galway</small></button>
      </div>
    </section>
  </div>
</div>

<div class="dock">
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask about a tour, price or availability" aria-label="Message"></textarea>
    <button class="send" id="send" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="fine">Atlantic Tours is fictitious, built for an AI Badge demo. Data: <a href="https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/edit" target="_blank" rel="noopener">live Google Sheet</a>.</p>
</div>

<script>
const API = "https://atlantic-tours-bot.victordelrosal.workers.dev";
const $ = id => document.getElementById(id);
const col = $("col"), scroll = $("scroll"), q = $("q"), send = $("send"), hello = $("hello");
let history = [], busy = false;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// Light formatting for bot replies: paragraphs, "-" bullet lists, **bold**.
function format(text) {
  const out = []; let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const m = line.match(/^[-*•]\s+(.*)/);
    if (m) { (list ||= []).push(`<li>${inline(m[1])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

function addRow(role, html) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "bot");
  row.innerHTML = role === "user"
    ? `<div class="bubble"></div>`
    : `<div class="av"><img src="icon.svg" alt=""></div><div class="bubble">${html}</div>`;
  if (role === "user") row.querySelector(".bubble").textContent = html;
  col.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
  return row.querySelector(".bubble");
}

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; hello.remove(); $("reset").hidden = false;
  addRow("user", text);
  history.push({ role: "user", content: text });
  q.value = ""; grow(); send.disabled = true;
  const b = addRow("assistant", `<span class="dots"><i></i><i></i><i></i></span>`);
  try {
    const r = await fetch(API + "/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "error");
    b.innerHTML = format(d.reply);
    history.push({ role: "assistant", content: d.reply });
  } catch (e) {
    b.innerHTML = `<p>Sorry, I couldn't reach the tour schedule just now. Please try again in a moment.</p>`;
    history.pop();
  }
  scroll.scrollTop = scroll.scrollHeight;
  busy = false; q.focus();
}

function grow() { q.style.height = "auto"; q.style.height = q.scrollHeight + "px"; send.disabled = !q.value.trim() || busy; }
q.addEventListener("input", grow);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
$("form").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
document.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => ask(c.dataset.q)));
$("reset").addEventListener("click", () => location.reload());

async function ping() {
  try {
    const r = await fetch(API + "/tours");
    const d = await r.json();
    if (!r.ok) throw 0;
    const t = new Date(d.fetchedAt).toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" });
    $("status").textContent = `Live · ${d.rows.length} tours · ${t}`;
    $("dot").className = "dot";
  } catch { $("status").textContent = "Schedule offline"; $("dot").className = "dot err"; }
}
ping(); setInterval(ping, 60000);
q.focus();
</script>
</body>
</html>
